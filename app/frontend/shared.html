<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREE LAB · Shared object</title><link rel="stylesheet" href="/assets/style.css"></head><body><div class="app-shell"><header class="header"><a class="brand" href="/"><span class="brand-mark">◈</span><span>FREE LAB</span></a></header><main class="workspace" style="max-width:630px;margin:65px auto;"><p class="eyebrow">SHARED SPATIAL OBJECT</p><h1 id="title">Opening private link…</h1><p id="description" class="lead"></p><img id="image" style="width:100%;border-radius:22px;display:none" alt="Shared snapshot"><p class="small-muted" id="owner"></p></main></div><script>
(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token||!/^[\w-]{32,80}$/.test(token)){document.getElementById('title').textContent='Invalid link';return;}try{const r=await fetch('/api/shared/'+token);if(!r.ok)throw Error('This link is unavailable or revoked');const j=await r.json();document.getElementById('title').textContent=j.object.label;document.getElementById('description').textContent=j.object.description||'Shared from a private collection';document.getElementById('owner').textContent='Shared by '+j.object.owner;if(j.object.has_image){const img=document.getElementById('image');img.src='/api/shared/'+token+'/image';img.style.display='block'}}catch(e){document.getElementById('title').textContent=e.message}})();</script></body></html>
